name: Legal RAG E5 FAISS smoke
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r legal_rag/requirements.txt
      - run: python -m unittest discover -s legal_rag/tests -v
      - name: Download multilingual E5 into an isolated CI cache
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download('intfloat/multilingual-e5-base', local_dir='legal_rag/data/models/multilingual-e5-base')"
      - name: Build an actual FAISS index from fictional articles
        run: |
          node server/scripts/prepare-legal-corpus.cjs --input examples/rag-eval/legal-articles.sample.json --output legal_rag/data/corpus
          ACTELYO_E5_MODEL=legal_rag/data/models/multilingual-e5-base python -m legal_rag.cli index --corpus legal_rag/data/corpus --output legal_rag/data/index
          ACTELYO_E5_MODEL=legal_rag/data/models/multilingual-e5-base ACTELYO_LEGAL_INDEX=legal_rag/data/index python -c "from legal_rag.api import health, search, SearchRequest; assert health()['articles'] == 1; assert search(SearchRequest(query='article fictif'))['results'][0]['id'] == 'demo-1'"
