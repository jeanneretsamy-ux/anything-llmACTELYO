name: Actelyo RAG Desktop installer

on:
  push:
    branches: [master]
    paths:
      - desktop/**
      - .github/workflows/desktop-openrag-installer.yml
      - server/scripts/rag-eval.cjs
      - server/utils/ragEvaluation.cjs
      - server/__tests__/ragEvaluation.node.test.cjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Test legal import and retrieval evaluation
        run: node --test server/__tests__/ragEvaluation.node.test.cjs

      - name: Test GUI and API collector workspace consistency
        run: node --test desktop/tests/upload-storage.test.cjs desktop/tests/service-discovery.test.cjs

      - name: Download verified 1.0.2 runtime package
        shell: pwsh
        run: |
          $url = 'https://github.com/jeanneretsamy-ux/actelyo-downloads/releases/download/desktop-rag-v1.0.2/Actelyo-RAG-Desktop-Setup-1.0.2-x64.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'Actelyo-RAG-Desktop-Setup-1.0.2-x64.exe'
          & curl.exe -fL --retry 3 -o $installer $url
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          $expected = '8BB5A6D2435899EC68593E1B358456BD81A713D8B28F2363F10385DAD8FAC128'
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "Unexpected runtime package hash: $actual" }

      - name: Extract runtime through Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'Actelyo-RAG-Desktop-Setup-1.0.2-x64.exe'
          $target = 'C:\ragbase'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', "/DIR=$target", "/LOG=$env:RUNNER_TEMP\ragbase-install.log") -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            Get-Content -LiteralPath "$env:RUNNER_TEMP\ragbase-install.log" -Tail 40
            throw "Runtime extraction failed: $($process.ExitCode)"
          }
          foreach ($file in @('resources\runtime\node.exe', 'resources\runtime\server\index.js', 'resources\runtime\collector\index.js')) {
            if (-not (Test-Path -LiteralPath (Join-Path $target $file))) { throw "Missing runtime file: $file" }
          }

      - name: Package Desktop 1.0.6
        shell: pwsh
        run: |
          npm ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          $env:ACTELYO_RAG_RUNTIME = 'C:\ragbase\resources\runtime'
          $env:ACTELYO_RAG_BUILD_DIR = 'C:\ragout'
          node desktop/build.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Desktop packaging failed' }
          $asar = 'C:\ragout\resources\app.asar'
          if (-not (Test-Path -LiteralPath $asar)) { throw 'Missing app.asar' }
          node -e "const a=require('./desktop/node_modules/@electron/asar'); const p='C:/ragout/resources/app.asar'; if(!a.listPackage(p).some(x=>x.endsWith('openrag-setup.cjs'))) process.exit(1)"
          if ($LASTEXITCODE -ne 0) { throw 'OpenRAG setup module missing from app.asar' }

      - name: Stamp Actelyo RAG logo and version on the executable
        shell: pwsh
        run: |
          $rcedit = Join-Path $env:RUNNER_TEMP 'rcedit-x64.exe'
          & curl.exe -fsSL --retry 3 -o $rcedit 'https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe'
          if ((Get-FileHash -LiteralPath $rcedit -Algorithm SHA256).Hash -ne '3E7801DB1A5EDBEC91B49A24A094AAD776CB4515488EA5A4CA2289C400EADE2A') { throw 'Unexpected rcedit hash' }
          $exe = 'C:\ragout\Actelyo RAG.exe'
          & $rcedit $exe --set-icon desktop\branding\actelyo.ico --set-product-version 1.0.6 --set-file-version 1.0.6 --set-version-string ProductName 'Actelyo RAG Desktop' --set-version-string FileDescription 'Actelyo RAG Desktop' --set-version-string CompanyName 'Actelyo'
          if ($LASTEXITCODE -ne 0) { throw 'rcedit failed' }

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $compiler = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $compiler) { $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup is unavailable' }
          & $compiler '/DSourceDir=C:\ragout' 'desktop\installer.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          $package = 'desktop\dist\Actelyo-RAG-Desktop-Setup-1.0.6-x64.exe'
          if (-not (Test-Path -LiteralPath $package)) { throw 'Installer missing' }
          Get-Item -LiteralPath $package | Select-Object Name, Length
          Get-FileHash -LiteralPath $package -Algorithm SHA256

      - name: Install and test actual API document collection
        shell: pwsh
        run: |
          $setup = Resolve-Path 'desktop/dist/Actelyo-RAG-Desktop-Setup-1.0.6-x64.exe'
          $process = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS','/DIR=C:\ragqa') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installation failed: $($process.ExitCode)" }
          node desktop/tests/installed-api-upload.cjs C:/ragqa "$env:GITHUB_WORKSPACE/api-proof"
          if ($LASTEXITCODE -ne 0) { throw 'Installed API upload verification failed' }

      - name: Check the actual installed window icon
        shell: powershell
        run: desktop/tests/window-branding.ps1 -Executable 'C:\ragqa\Actelyo RAG.exe' -ExpectedIcon 'desktop/branding/actelyo.ico' -ProofDirectory "$env:RUNNER_TEMP\rag-window-proof"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Actelyo-RAG-Desktop-Setup-1.0.6-x64
          path: |
            desktop/dist/Actelyo-RAG-Desktop-Setup-1.0.6-x64.exe
            api-proof/api-upload-proof.json
            ${{ runner.temp }}/rag-window-proof/window-branding.json
            ${{ runner.temp }}/rag-window-proof/window-icon.png
          if-no-files-found: error
          compression-level: 0

      - name: Publish installer as a GitHub release
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'actelyo-rag-desktop-v1.0.6'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --target ${{ github.sha }} --title 'Actelyo RAG Desktop 1.0.6' --notes 'Corrige la collecte de documents via API Desktop. Chemin identique au collecteur de l interface. Installation et transfert API verifies, logo cyan conserve.' }
          gh release upload $tag desktop/dist/Actelyo-RAG-Desktop-Setup-1.0.6-x64.exe api-proof/api-upload-proof.json
